<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — FREE-FIVEM-SERVER</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <img id="logo" src="img/logo.png" alt="logo" />
    <div id="status">
      <div id="bank">Bank: $0</div>
      <div id="blackmoney">Black: $0</div>
      <div id="job">Job: Unemployed</div>
      <div id="vitals">Health: 100 | Hunger: 100 | Water: 100 | Armor: 0</div>
    </div>
  </div>

  <div id="adminPanel" class="hidden">
    <h1>Admin Panel (Black & Orange)</h1>
    <div class="controls">
      <button id="teleport">Teleport</button>
      <button id="ban">Ban Player</button>
      <!-- many more buttons will be added in future commits -->
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
