<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel & Shops — FREE-FIVEM-SERVER</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <img id="logo" src="img/logo.png" alt="logo" />
    <div id="status">
      <div id="bank">Bank: $0</div>
      <div id="blackmoney">Black: $0</div>
      <div id="job">Job: Unemployed</div>
      <div id="vitals">Health: 100 | Hunger: 100 | Water: 100 | Armor: 0</div>
    </div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="panelHeader">
      <img src="img/logo.png" id="panelLogo" />
      <h1>Admin Panel</h1>
      <button id="closeBtn">X</button>
    </div>
    <div class="panelBody">
      <div class="section">
        <h2>Player Management</h2>
        <input id="targetId" placeholder="Player ID" />
        <input id="reason" placeholder="Reason" />
        <button data-action="kick">Kick</button>
        <button data-action="ban">Ban</button>
        <button data-action="tempban">Tempban (1h)</button>
      </div>

      <div class="section">
        <h2>Economy</h2>
        <input id="amount" placeholder="Amount" />
        <button data-action="giveMoney">Give Money</button>
      </div>

      <div class="section">
        <h2>Teleport / Spawn</h2>
        <input id="coords" placeholder="x,y,z" />
        <button data-action="teleport">Teleport Player</button>
        <input id="vehicleModel" placeholder="Vehicle Model" />
        <button data-action="spawnVehicle">Spawn Vehicle</button>
      </div>

      <div class="section">
        <h2>Jobs</h2>
        <input id="jobName" placeholder="job name" />
        <input id="jobGrade" placeholder="grade" />
        <button data-action="setJob">Set Job</button>
      </div>

      <div class="section">
        <h2>Quick Actions</h2>
        <button data-action="announce">Announce</button>
        <button data-action="toggleAnticheat">Toggle Anticheat</button>
      </div>

    </div>
  </div>

  <div id="storePanel" class="hidden">
    <div class="panelHeader">
      <h1 id="storeTitle">Store</h1>
      <button id="closeStore">X</button>
    </div>
    <div class="panelBody" id="storeBody">
      <!-- Items will be injected here -->
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
